[project]
name = "mmrag-5g"
version = "1.0.0"
description = "PCAM ZG516 Assignment 2 - Part A: Multimodal Document Retrieval System (5G / O-RAN corpus)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- parsing ---
    "pymupdf>=1.24",          # PDF text, tables (find_tables), images
    "python-pptx>=1.0",       # PPTX text, tables, pictures
    "pillow>=10.0",
    "pytesseract>=0.3.10",    # optional OCR fallback (needs tesseract binary)
    # --- retrieval / numerics ---
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",      # offline TF-IDF/LSA embedder fallback
    "rank-bm25>=0.2.2",       # sparse retrieval for hybrid search
    # --- prompting / llm ---
    "jinja2>=3.1",
    "requests>=2.31",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    # --- corpus generator / reports ---
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]          # neural embeddings + cross-encoder reranker
ocr = ["rapidocr-onnxruntime>=1.3.24"]       # pip-only OCR (no system install needed)
chroma = ["chromadb>=0.5"]                    # persistent vector store
ui = ["streamlit>=1.36"]                      # demo UI
yolo = ["ultralytics>=8.2"]                   # optional YOLO layout detection
notebook = ["jupyter>=1.0", "ipykernel>=6.29"]
all = [
    "sentence-transformers>=3.0",
    "rapidocr-onnxruntime>=1.3.24",
    "chromadb>=0.5",
    "streamlit>=1.36",
]

[project.scripts]
mmrag = "mmrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmrag"]

[dependency-groups]
dev = ["pytest>=8.0"]
